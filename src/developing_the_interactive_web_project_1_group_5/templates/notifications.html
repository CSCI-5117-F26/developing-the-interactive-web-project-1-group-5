{% extends "parent.html" %}
{% block title %}Notifications{% endblock %}

{% block head %}
{% endblock %}

{% block body %}

<div class="pure-g">
    <div class="pure-u-1"><h1>Notifications</h1></div>

    <div class="pure-u-1 pure-u-md-1-5"></div>

    <div class="pure-u-1 pure-u-md-3-5 notif-box" style="background-color: gray;">
        {% for notif in notifs %}

        <div class="pure-g notif-content" style="background-color: lightsalmon;">
            <div class="pure-u-1-8 notif-pic" style="background-color: lightcoral;">pic</div>
            <div class="pure-u-5-8 notif-text" style="background-color: lightblue;">
                <p>{{notif.username}} connected <a href="{{ url_for('view_node', node_id= notif.usernode) }}">{{notif.usertitle}}</a> 
                    to <a href="{{ url_for('view_node', node_id= notif.connectingnode) }}">{{notif.connectingtitle}}</a></p>
            </div>
            <div class="pure-u-1-8 disconnect-button" style="background-color: lightgreen;">
                <button class="pure-button">Disconnect</button>
            </div>
            <div class="pure-u-1-8 notif-close" style="background-color: cornsilk;">go away</div>
        </div>

        {% endfor %}
    </div>

    <div class="pure-u-1 pure-u-md-1-5 "></div>
</div>

{% endblock %}
