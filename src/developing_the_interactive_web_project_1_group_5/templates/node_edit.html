{% extends "node_parent.html" %}

{% block title %}Edit Node{% endblock %}
{% block node_info %}
<!-- TODO: none of this works yet -->
    <form class="pure-form pure-form-stacked"
          method="POST"
          action="{{ url_for('create_node') }}">


        <label for="node_title"><strong>New Title: </strong></label>
        <!-- Do we want input validation? Feels like there's a lot more options here -->
        <input type="text" id="node_title" name="node_title" value="{{node_title}}" placeholder="Title" minLength="1" maxLength="60">

        <p><strong>Owner: You ({{node_owner}})</strong></p>
        <label for="node_description"><strong>Description:</strong></label>
        <!-- Maybe: add a char counter -->
        <textarea id="node_description"
                  name="node_description"
                  rows="5" maxLength="600" style="width:100%;" placeholder="Description">{{node_description}}</textarea>

        <button style="background-color: red" onclick="window.location.href='{{url_for('delete_node', node_id=node_id)}}'" class="pure-button">
            Delete
        </button>
        <button class="pure-button" href="#">
            Cancel
        </button>
        <button type="submit" class="pure-button pure-button-primary">
            Save
        </button>
        
    </form>

{% endblock %}
