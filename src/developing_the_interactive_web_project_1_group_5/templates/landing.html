{% extends "parent.html" %}

{% block title %}Quilt{% endblock %}
{% block head %}
<link rel="stylesheet" href="../static/css/node.css">
{% endblock %}
{% block body %}
<div class="pure-g center-text">
    <form action="{{url_for('landing')}}" method="post" class="pure-form" id="randomize-btn-div"
        style="padding:1em 1em;">
        <!-- <input type="text" id="search_query" name="search_query">
            <button type="submit" class="pure-button pure-button-primary">Search</button> -->
        <button type="button" class="pure-button landing-button" id="randomize-button">Randomize!</button>
    </form>

    <div class="pure-u-1">
        <div class="connection-tabs" id="connection-tabs">
            <input type="radio" name="tabs" id="tab-one" checked>
            <input type="radio" name="tabs" id="tab-two">
            <input type="radio" name="tabs" id="tab-three">
            <input type="radio" name="tabs" id="tab-four">
            <div class="pure-g">
                <label class="pure-u-1-4 label" for="tab-one">Categories</label>
                <label class="pure-u-1-4 label" for="tab-two">Popular Nodes</label>
                <label class="pure-u-1-4 label" for="tab-three" {%if loggedin is not true%} hidden {%endif%}>Recently
                    Viewed</label>
                <label class="pure-u-1-4 label" for="tab-four" {%if loggedin is not true%} hidden {%endif%}>New
                    Connections</label>
            </div>

            <div class="panel" id="panel-one">
                <div class="pure-g">
                    {% for category in categories%}
                    <div class="pure-u-1-2 pure-u-md-1-4">
                        <div class="node-box">
                            <button class="pure-button node-card" onclick="window.location.href='{{category.link}}';">
                                <img class="pure-img connection-img" src="{{category.img_url}}">
                                <p class="center-text line-clamp">{{category.node_title}}</p>
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="pure-g" id="panel-two">
                <div class="pure-g">
                    {% for node in popular_nodes%}
                    <div class="pure-u-1-2 pure-u-md-1-4">
                        <div class="node-box">
                            <button class="pure-button node-card" onclick="window.location.href='{{node.link}}';">
                                <img class="pure-img connection-img" src="{{node.img_url}}">
                                <p class="center-text line-clamp">{{node.node_title}}</p>
                            </button>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>

            <div class="panel" id="panel-three">
                <div class="pure-u-1-3" id="display-node"></div>
            </div>
            <div class="panel" id="panel-four">
                <div></div>
            </div>
        </div>

        {% endblock %}
