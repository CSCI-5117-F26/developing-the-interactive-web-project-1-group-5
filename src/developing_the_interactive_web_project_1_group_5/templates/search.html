{% extends "parent.html" %}

{% block title %}Quilt{% endblock %}
{% block head %}
<link rel="stylesheet" href="../static/css/landing-style.css">
{% endblock %}
{% block body %}
<div class="pure-g">
    {% for node in show %}
    <div class="pure-u-1-2 pure-u-md-1-4">
        <div class="node-box">
            <button class="pure-button node-card" onclick="window.location.href='{{node.link}}';">
                {% if node.image_id %}
                <img class="pure-img connection-img" src="{{ url_for('get_image', image_id=node.image_id) }}">
                {% else %}
                <img class="pure-img connection-img" src="../static/img/temp_chungus.png">
                {% endif %}
                <p class="center-text line-clamp">{{node.node_title}}</p>
            </button>
        </div>

    </div>
    {% else %}
    <div class="node-box"> </div>
    <p>no nodes match your search!</p>
</div>

{% endfor %}
</div>

{% endblock %}
