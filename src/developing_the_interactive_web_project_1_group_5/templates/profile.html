{% extends "parent.html" %}

{% block title %}Profile{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile-styles.css') }}">
{% endblock %}
{% block body %}

<div class="pure-g">
    <div class="pure-u-1-4 profile-sidebar">
        <div class="sidebar-box">
            <img class="pfp" src="{{ url_for('static', filename ='img/temp_image.jpg') }}" alt="ye pfp">
            <h1 class="profile-name"></h1>
            <h1 class="profile-name">{{ user.name }}</h1>
            <p class="profile-bio">{{ user.bio or "Empty bio"}}</p>
            <a class="pure-button" href="{{url_for('view_settings')}}">Settings</a>
            <a class="pure-button" href="">Logout</a>
        </div>
    </div>

    <div class="pure-u-3-4">
        <div class="pure-menu pure-menu-horizontal profile-tabs">
            <ul class="pure-menu-list">
                <li class="pure-menu-item {% if tab == 'saved' %}pure-menu-selected{% endif %}">
                    <a class="pure-menu-link">Saved</a>
                </li>
                <li class="pure-menu-item {% if tab == 'yours' %}pure-menu-selected{% endif %}">
                    <a class="pure-menu-link">Yours</a>
                </li>

            </ul>
        </div>

    </div>
</div>


{% endblock %}
