{%extends "parent.html"%}

{%block overlay%}
<div id="full-overlay">
    <div id="profile-setup-overlay">
        <h2>Nice to meet you!</h2>
        <p>What should people refer to you as?</p>
        <form class="pure-form" action="{{ url_for('username_setup') }}" method="post">
            <fieldset>
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                <label for="username-input"> Enter username:</label>
                <input name="username" id="username-input" type="text" minlength="3" maxlength="15"
                    required>
                <button type="submit" class="pure-button pure-button-primary landing-button "> Start quilting! </button>
            </fieldset>
        </form>
    </div>
</div>
{%endblock%}
