{% extends "parent.html" %}
{% block title %}Settings{% endblock %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile-styles.css') }}">
{% endblock %}
{% block body %}

<div class="pure-g">
    <div class="pure-u-1-4 profile-sidebar">
        <div class="sidebar-box">
            {% if user.profpicid %}
                <img class="pfp" src="{{ url_for('get_image', image_id=user.profpicid) }}" alt="ye pfp">
            {% else %}
                <img class="pfp" src="{{ url_for('static', filename ='img/temp_chungus.png') }}" alt="ye pfp">
            {% endif %}
            <h1 class="profile-name"></h1>
            <h1 class="profile-name">{{ user.name }}</h1>
            <p class="profile-bio">{{ user.bio or "Empty bio"}}</p>
            <a class="pure-button" href="{{url_for('view_settings')}}">Settings</a>
            <a class="pure-button" href="">Logout</a>
        </div>
    </div>
    <div class="pure-u-3-4">
        <div class="settings-box">

            <form class="pure-form pure-form-stacked" method="POST" enctype="multipart/form-data">
                <h1>Edit Profile Settings</h1>
                <fieldset>
                    <span class="settings-line"></span>
                    <label for="picture">Profile picture (optional)</label>
                    <input id="picture" name="picture" type="file" accept="image/*">
                    <span class="settings-line"></span>

                    <label for="name"><h2>Edit Name</h2></label>
                    <input id="name" name="name" type="text" placeholder="Enter new name here">
                    <span class="settings-line"></span>

                    <label for="bio"><h2>Edit Bio</h2></label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Crazy? I was crazy once. They locked me in a room. A rubber room. A rubber room with rats. And rats make me crazy."></textarea>

                    <!-- Wanted space between the buttons and edit bio and I'm too lazy to css it -->
                    <h1></h1>

                    <button type="submit" class="pure-button">Save</button>
                    <!-- just something that'll redirect them to profile.html if a user changes their mind -->
                    <a class="pure-button" href="{{ url_for('view_profile') }}">Cancel</a>
                </fieldset>
            </form>
        </div>
    </div>


</div>

{% endblock %}
