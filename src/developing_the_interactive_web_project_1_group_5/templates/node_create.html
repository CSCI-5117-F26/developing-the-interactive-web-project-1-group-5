{% extends "node_parent.html" %}

{% block title %}Create Node{% endblock %}

<!-- TODO: Allow file upload by clicking img - NOT DOING THIS FOR NOW -->
{% block main_image %}
<img class="pure-img node-img" id="nodeImg" src="../static/img/temp_chungus.png">
{% endblock %}
{% block node_info %}

<form class="pure-form pure-form-stacked" method="POST" action="{{ url_for('create_node') }}"
    enctype="multipart/form-data">
    <div class="field">
        <h1 class="non-style"> Create Patch </h1>
        <label for="picture">Upload Image</label>
        <input id="picture" class="pure-button file-input" name="picture" type="file" accept="image/*" required>
    </div>

    <div class="field">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="node_title">
            <h2 class="non-style">Title</h2>
        </label>
        <input class="pure-u-1" type="text" id="node_title" name="node_title" placeholder="What do we have here?"
            minLength="1" maxLength="50" required="">
    </div>


    <div class="field">
        <label for="node_description">
            <h2>Description <span id="char_count" class="p"></span></h2>
        </label>
        <textarea class="pure-u-1" id="node_description" name="node_description" rows="5" maxLength="240"
            style="width:100%;" placeholder="Tell us about your patch!"></textarea>
    </div>

    <div class="field">
        <div class="node-buttons">
            <button type="submit" class="pure-button pure-button-primary profile-buttons">
                Create Patch
            </button>
        </div>
    </div>


</form>
{% endblock %}
