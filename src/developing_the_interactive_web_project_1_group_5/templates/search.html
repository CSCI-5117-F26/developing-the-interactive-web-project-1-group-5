{% extends "parent.html" %}

{% block title %}Quilt{% endblock %}
{% block head %}
<link rel="stylesheet" href="../static/css/landing-style.css">
{% endblock %}
{% block body %}
<div class="pure-g">
    {% for node in show %}

    <div class="pure-u-1-2 pure-u-md-1-4">
        <div class="node-box">
            <button class="pure-button node-card" onclick="window.location.href='/node/{{node.nodeid}}';">
                <img class="pure-img connection-img" src="{{node.img}}">
                <p class="center-text line-clamp">{{node.title}}</p>
            </button>
        </div>
    </div>
    {% endfor %}
</div>




{% endblock %}
