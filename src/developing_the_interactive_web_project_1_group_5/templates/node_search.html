{% for node in show %}
<div class="pure-u-1-2 pure-u-md-1-4">
    <div class="node-box">

        <button class="pure-button connection-img" onclick='selectConnection(this, "{{node.node_id}}")'>
            {% if node.image_id %}
            <img class="pure-img modal-img" src="{{ url_for('get_image', image_id=node.image_id) }}" loading="lazy">
            {% else %}
            <img class="pure-img modal-img" src="../static/img/temp_chungus.png" loading="lazy">
            {% endif %}
            <p class="center-text line-clamp">{{node.node_title}}</p>
        </button>
    </div>

</div>
{% else %}
<p>no nodes match your search!</p>
{% endfor %}
