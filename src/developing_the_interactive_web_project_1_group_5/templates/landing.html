{% extends "parent.html" %}

{% block title %}Quilt{% endblock %}
{% block head %}
<link rel="stylesheet" href="../static/css/node.css">
{% endblock %}
{% block body %}

<div id="kickstart-section">
    <div>
        <h1> Can't decide where to start?</h1>
        <h2> We'll pick for you!</h2>
    </div>
    <div>
        <form action="{{url_for('landing')}}" method="post" class="pure-form" id="randomize-btn-div"
            style="padding:1em 1em;">
            <button type="button" class="pure-button landing-button" id="randomize-button">
                <h2>Surprise me!</h2>
            </button>
        </form>
    </div>
</div>


<div class="pure-u-1">
    <div class="profile-tabs">

        <input class="radiotab" type="radio" name="tabs" id="tab-two">
        <label class="pure-u-1-4 tab-label" for="tab-two">All Patches</label>
        <div class="panel" id="panel-two">
            <div class="pure-g">
                {% for node in popular_nodes%}
                <div class="pure-u-1-2 pure-u-md-1-4">
                    <div class="node-box">
                        <button class="pure-button node-card" onclick="window.location.href='{{node.link}}';">
                            <img class="pure-img connection-img" src="{{node.img_url}}">
                            <p class="center-text line-clamp">{{node.node_title}}</p>
                        </button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <input class="radiotab" type="radio" name="tabs" id="tab-four">
        <label class="pure-u-1-4 tab-label" for="tab-four" {%if loggedin is not true%} hidden {%endif%}>New
            Connections</label>
        <div class="panel" id="panel-four">
            <div></div>
        </div>

        <input class="radiotab" type="radio" name="tabs" id="tab-one" checked>
        <label class="pure-u-1-4 tab-label" for="tab-one">Categories</label>
        <div class="panel" id="panel-one">
            <div class="pure-g">
                {% for category in categories%}
                <div class="pure-u-1-2 pure-u-md-1-4">
                    <div class="node-box">
                        <button class="pure-button node-card" onclick="window.location.href='{{category.link}}';">
                            <img class="pure-img connection-img" src="{{category.img_url}}">
                            <p class="center-text line-clamp">{{category.node_title}}</p>
                        </button>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>

        <input class="radiotab" type="radio" name="tabs" id="tab-three">
        <label class="pure-u-1-4 tab-label" for="tab-three" {%if loggedin is not true%} hidden {%endif%}>Recently
            Viewed</label>

        <div class="panel" id="panel-three">
            <div class="pure-u-1-3" id="display-node"></div>
        </div>

    </div>

    {% endblock %}
