{% extends "node_parent.html" %}

{% block title %}Create Node{% endblock %}

<!-- TODO: Allow file upload by clicking img - NOT DOING THIS FOR NOW -->
{% block main_image %}
<button disabled="true" class="pure-button node-img center-text" style="font-size: 500%;">

    <!-- <i class="fa-solid fa-upload"></i> -->
</button>
{% endblock %}
{% block node_info %}
<h1> Create Patch </h1>
<form class="pure-form pure-form-stacked" method="POST" action="{{ url_for('create_node') }}"
    enctype="multipart/form-data">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="node_title">
        <h2 class="non-style">Title</h2>
    </label>
    <!-- Do we want input invalidation? Feels like there's a lot more options here -->
    <input class="pure-u-1" type="text" id="node_title" name="node_title" placeholder="What do we have here?"
        minLength="1" maxLength="60" required="">
    <label for="node_description">
        <h2>Description</h2>
    </label>
    <!-- Maybe: add a char counter -->
    <textarea class="pure-u-1" id="node_description" name="node_description" rows="5" maxLength="600"
        style="width:100%;" placeholder="Tell us about your patch!"></textarea>
    <label for="picture">Upload Image</label>
    <input id="picture" class="pure-button file-input" name="picture" type="file" accept="image/*">
    <button type="submit" class="pure-button pure-button-primary">
        Create Node
    </button>


</form>
{% endblock %}
