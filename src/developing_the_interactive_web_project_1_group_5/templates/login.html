{%extends "parent.html"%}

{%block overlay%}
<div id="full-overlay">
    <div id="login-overlay">
        <h1>Get to quilting!</h1>
        <h2>Sign up to to keep exploring similar patches and save ones you like!</h2>
        <img id="overlay-image" src="{{ url_for('static', filename ='img/real_chungus.png') }}" alt="little guy">
        <div id="links-container">
            <div><a id="signup-button" class="pure-button pure-button-primary profile-buttons" href="{{url_for('login')}}">Login</a>
            </div>
            <div><a id="close-overlay" class="pure-button profile-buttons" href="{{url_for('landing')}}">Continue Without Login</a></div>
        </div>

    </div>
</div>

   
{%endblock%}
