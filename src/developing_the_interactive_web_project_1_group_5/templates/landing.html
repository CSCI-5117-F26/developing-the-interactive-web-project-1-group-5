{% extends "parent.html" %}

{% block title %}Quilt{% endblock %}
{% block head %}
<link rel="stylesheet" href="../static/css/landing-style.css">
{% endblock %}
{% block body %}

<form action="/" method="post" class="pure-form" id="randomize-btn-div">
    <!-- <input type="text" id="search_query" name="search_query">
        <button type="submit" class="pure-button pure-button-primary">Search</button> -->
    <button type="button" class="pure-button" id="randomize-button">Randomize!</button>
</form>

<div class="all-tab-stuff" id="landing-tabs">
    <input type="radio" name="tabs" id="tab-one" checked>
    <input type="radio" name="tabs" id="tab-two">
    <input type="radio" name="tabs" id="tab-three">
    <input type="radio" name="tabs" id="tab-four">

    <div class="pure-g">
        <label class="pure-u-1-4 label" for="tab-one">Popular Categories</label>
        <label class="pure-u-1-4 label" for="tab-two">Popular Nodes</label>
        <label class="pure-u-1-4 label" for="tab-three" hidden>Recently Viewed</label>
        <label class="pure-u-1-4 label" for="tab-four" hidden>New Connections</label>
    </div>

    <div class="panel" id="panel-one">
        <div class="pure-u-1-3 panel-all" id="display-node">
            <p>Categorry: Tony Hawk</p>
        </div>

        <div class="pure-u-1-3  panel-all" id="display-node">
            <p>Categorry: Skateboarding</p>
        </div>

        <div class="pure-u-1-3  panel-all" id="display-node">
            <p>Categorry: Kitty</p>
        </div>
    </div>

    <div class="panel" id="panel-two">
        <div class="pure-u-1-3  panel-all" id="display-node">
            <img class="pure-img" src="../static/img/temp_image.jpg">
            <a href="/node/1">Plate with Alexander and Diogenes
            </a>
        </div>
        <div class="pure-u-1-3  panel-all" id="display-node">
            <img class="pure-img" src="../static/img/temp_image.jpg">
            <a href="/node/1">Plate with Alexander and Diogenes
            </a>
        </div>
    </div>

    <div class="panel" id="panel-three">
        <div class="pure-u-1-3" id="display-node"></div>
    </div>
    <div class="panel" id="panel-four">
        <div></div>
    </div>

</div>

{% endblock %}
