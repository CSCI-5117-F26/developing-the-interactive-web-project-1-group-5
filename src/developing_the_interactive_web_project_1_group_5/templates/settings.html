{% extends "profile.html" %}
{% block title %}Settings{% endblock %}
{% block panel %}

<div class="pure-u-1 pure-u-md-1 pure-u-lg-3-4">
    <div class="format-box">
        <form class="pure-form pure-form-stacked" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="field">
                <h1 class="non-style">Edit Profile Settings</h1>
                <label for="picture">Upload Image (optional) </label>
                <input id="picture" class="pure-button file-input" name="picture" type="file" accept="image/*">
            </div>


            <div class="field">
                <label for="username">
                    <h2>Edit Name</h2>
                </label>
                <input class="pure-u-1" id="username" name="username" type="text" placeholder="{{user.name}}">
            </div>

            <div class="field">
                <label for="bio">
                    <h2>Edit Bio</h2>
                </label>
                <textarea class="pure-u-1" id="bio" name="bio" rows="4" placeholder="{{ user.bio}}"></textarea>
            </div>

            <div class="field">
                <!-- just something that'll redirect them to profile.html if a user changes their mind -->
                <div class="node-buttons">
                    <a class="pure-button profile-buttons" href="{{ url_for('view_profile') }}">Cancel</a>
                    <button type="submit" class="pure-button pure-button-primary profile-buttons">Save</button>
                </div>
            </div>

        </form>
    </div>
</div>



<script src="../static/js/edit_profile.js"></script>
{% endblock %}
