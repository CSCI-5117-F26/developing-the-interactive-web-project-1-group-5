<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Placeholder{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css"
        integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/pure-min.css"
        integrity="sha384-kj0X2NG2KHBie8Tq8fH1kxnyWM9XsXQpq7XdwbKmFKjwwaXGKBlB2Klu3VOltSFx" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.1.0/build/grids-responsive-min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style-nav-temp.css') }}">

    {% block head %}
    {% endblock %}
</head>

<body>
    <nav>
        <div id="nav-container">
            <div>
                <a id="home-link" href="{{url_for('landing')}}">
                    <h1 class="logo">QUILT</h1>
                </a>
            </div>
            <!-- <div id="search-container">
                <search>
                    <form class="pure-form">
                        <input class="pure-input-rounded pure-input-1" type="search" id="search-bar" name="search"
                            placeholder="Search">
                    </form>
                </search>
            </div> -->
            <div id="nav-links">
                {%if loggedin%}
                    <a class="icon-link" aria-hidden="true" href="/notifs"><i
                            class="bi bi-plus-circle align-middle"></i></a>
                    <a class="icon-link" aria-hidden="true" href="/notifs"><i class="bi bi-bell align-middle"></i></a>
                    <a class="icon-link" aria-hidden="true" href="/profile"><i
                            class="bi bi-person-circle align-middle"></i></a>
                {%else%}
                    <a id="login-button" class="pure-button" href="/notifs">Login</a>
                    <a id="signup-button" class="pure-button" href="/notifs">Sign Up</a>
                {%endif%}
            </div>
    </nav>
    {%block overlay%}
    {% endblock %}
    {% block body %}
    {% endblock %}
</body>

</html>
